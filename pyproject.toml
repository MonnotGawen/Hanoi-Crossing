[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hanoi-crossing"
version = "0.1.0"
description = "A two-player, partial-information Tower of Hanoi engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hanoi-crossing = "hanoi_crossing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
